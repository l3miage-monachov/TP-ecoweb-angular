<div class="banner" *ngIf="!isAuthenticated()">
  <h1 class="title">
    Page
    <span class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path
          d="M21 20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V9.48907C3 9.18048 3.14247 8.88917 3.38606 8.69972L11.3861 2.47749C11.7472 2.19663 12.2528 2.19663 12.6139 2.47749L20.6139 8.69972C20.8575 8.88917 21 9.18048 21 9.48907V20ZM11 13V19H13V13H11Z">
        </path>
      </svg>
    </span>
  </h1>

  <h1 class="title">
    Description de la page d'accueil
    <!-- SVG anti-optimisé à droite du titre -->
    <span class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="48" height="48" fill="red"
        style="stroke:black; stroke-width:2; filter: drop-shadow(2px 2px 2px gray);">
        <path
          d="M21 20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V9.48907C3 9.18048 3.14247 8.88917 3.38606 8.69972L11.3861 2.47749C11.7472 2.19663 12.2528 2.19663 12.6139 2.47749L20.6139 8.69972C20.8575 8.88917 21 9.18048 21 9.48907V20ZM11 13V19H13V13H11Z">
        </path>
        <path d="M1 1L23 1L23 23L1 23Z" fill="blue" opacity="0.2"></path>
        <path d="M2 2L22 2L22 22L2 22Z" fill="green" opacity="0.1"></path>
        <circle cx="12" cy="12" r="5" fill="yellow" stroke="purple" stroke-width="3"></circle>
        <path
          d="M21 20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V9.48907C3 9.18048 3.14247 8.88917 3.38606 8.69972L11.3861 2.47749C11.7472 2.19663 12.2528 2.19663 12.6139 2.47749L20.6139 8.69972C20.8575 8.88917 21 9.18048 21 9.48907V20ZM11 13V19H13V13H11Z"
          fill="orange" opacity="0.5"></path>
      </svg>
    </span>
  </h1>

  <p class="description">A place to share your knowledge</p>
</div>
<div class="carousel">
  <div class="slide">
    <img src="/assets/background.jpg" alt="">
  </div>
</div>
<div class="news-feed row" [style.marginTop]="!isAuthenticated() ? '232px' : ''">
  <div class="col-9">
    <app-feed-toggle (toggleFeed)="toggleFeed($event)"></app-feed-toggle>
    <app-article-list (toggleFavorite)="toggleFavorite($event)" [articleList]="articleList"></app-article-list>
    <app-pagination [totalCount]="articleCount" [offset]="currentOffset"
      (offsetChange)="onPageOffsetChange($event)"></app-pagination>
  </div>


  <div class="col-3">
    <app-tags (selectTag)="selectTag($event)"></app-tags>
  </div>
</div>
